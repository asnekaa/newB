name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 打包扩展
        run: node package.mjs

      - name: 等待 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # release-please 会先创建 Release（带自动生成的 changelog），这里等它出现再挂 zip
          for i in $(seq 1 20); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release 已存在，上传 zip"
              gh release upload "$GITHUB_REF_NAME" "newB-${VERSION}.zip" --clobber
              exit 0
            fi
            sleep 5
          done
          echo "等待超时，改为自己创建 Release"
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --generate-notes \
            "newB-${VERSION}.zip"
