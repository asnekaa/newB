name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本类型（auto = 按提交自动判断）"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bump-and-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 计算并写入新版本
        id: bump
        run: |
          node scripts/release.mjs --bump=${{ inputs.bump }}
          if git diff --quiet; then
            echo "没有可发布的改动，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 提交、打 tag
        if: steps.bump.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json CHANGELOG.md .release-please-manifest.json
          git commit -m "chore(release): ${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD --tags

      - name: 打包扩展
        if: steps.bump.outputs.skip == 'false'
        run: node package.mjs

      - name: 发布 Release
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${{ steps.bump.outputs.version }}"
          node scripts/publish-release.mjs

  publish-tag-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 打包扩展
        run: node package.mjs

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-release.mjs
